<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19201D" />
      <stop offset="50%" stop-color="#121815" />
      <stop offset="100%" stop-color="#0B0F0E" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
    <pattern id="majorGridPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid Overlays -->
  <rect width="1200" height="675" fill="url(#gridPattern)" />
  <rect width="1200" height="675" fill="url(#majorGridPattern)" />

  <!-- Outer Architectural Border -->
  <rect x="30" y="30" width="1140" height="615" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 6" />
  <rect x="42" y="42" width="1116" height="591" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.2" />

  <!-- Corner Crosshairs -->
  <g stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.6">
    <!-- Top Left -->
    <path d="M 20 42 L 54 42 M 42 20 L 42 54" />
    <!-- Top Right -->
    <path d="M 1146 42 L 1180 42 M 1158 20 L 1158 54" />
    <!-- Bottom Left -->
    <path d="M 20 633 L 54 633 M 42 611 L 42 645" />
    <!-- Bottom Right -->
    <path d="M 1146 633 L 1180 633 M 1158 611 L 1158 645" />
  </g>

  <!-- Center Focal Blueprint Circle -->
  <circle cx="600" cy="270" r="110" fill="#121815" fill-opacity="0.7" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="600" cy="270" r="124" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <circle cx="600" cy="270" r="90" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Icon Graphic in Center -->
  <g transform="translate(600, 270) scale(1.6)" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-15,-18 L-15,0 C-15,6 -8,10 -8,20 M-20,-18 L-10,-18 M-8,-18 L-8,-5 M15,-18 L15,20 M15,-18 C10,-18 7,-10 7,0 L15,0"/>
  </g>

  <!-- Header Category Badge -->
  <g transform="translate(600, 420)">
    <rect x="-160" y="-16" width="320" height="32" rx="4" fill="#0B0F0E" fill-opacity="0.8" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#D4AF37" text-anchor="middle">
      GASTRONOMY VENUE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="485" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">
    THE HONEYCOMB RESTAURANT
  </text>

  <!-- Subtitle -->
  <text x="600" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400" letter-spacing="1" fill="#A0ABA6" text-anchor="middle">
    Fine Dining Floor Plan & Chef Table Layout
  </text>

  <!-- Bottom Spec Bar -->
  <line x1="400" y1="550" x2="800" y2="550" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2" />
  <text x="600" y="575" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#D4AF37" fill-opacity="0.8" text-anchor="middle">
    [ ARCHITECTURAL PLACEHOLDER DIAGRAM — FOR OWNER REVIEW ]
  </text>
  <text x="600" y="600" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" letter-spacing="1.5" fill="#6C7A74" text-anchor="middle">
    KINYUKI COUNTRY HOTEL &amp; ESTATE · NANYUKI, KENYA
  </text>
</svg>